<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HyperPartner — превью нового hero-видео</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bronze:#C79A7E;--paper:#F5F4F0}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#0e1413;color:#F5F4F0;font-family:"IBM Plex Sans",system-ui,Segoe UI,sans-serif;line-height:1.5}
  .stage{position:relative;width:100%;height:100svh;overflow:hidden;background:#0e1413}
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%}
  .scrim{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(95deg, rgba(10,14,13,.62) 0%, rgba(10,14,13,.30) 34%, transparent 62%)}
  .copy{position:absolute;z-index:3;left:clamp(20px,6vw,96px);top:50%;transform:translateY(-50%);max-width:680px}
  h1{font-weight:500;letter-spacing:-.025em;line-height:1.04;margin:0;font-size:clamp(2.2rem,6vw,4.6rem);color:#fff;
    text-shadow:0 2px 30px rgba(0,0,0,.35)}
  .sub{margin:clamp(22px,3vh,34px) 0 0;padding:3px 0 3px 16px;border-left:2.5px solid var(--bronze);
    color:rgba(247,231,214,.92);font-weight:400;font-size:clamp(16px,1.6vw,25px);letter-spacing:.004em}
  .sub b{color:var(--bronze);font-weight:600;margin-left:.32em;font-size:1.05em;white-space:nowrap}
  .banner{position:fixed;left:0;right:0;bottom:0;z-index:9;background:rgba(199,154,126,.16);
    backdrop-filter:blur(8px);border-top:1px solid rgba(199,154,126,.35);padding:12px 18px;font-size:13.5px;
    color:#F5F4F0;text-align:center}
</style>
</head>
<body>
  <section class="stage">
    <video src="_preview/hero-slav.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="scrim"></div>
    <div class="copy">
      <h1>Рутину закрывают цифровые сотрудники.</h1>
      <p class="sub">Первый результат за<b>3 недели</b>.</p>
    </div>
  </section>
  <div class="banner">Превью нового hero-видео (славянка, кандидат 3, гамма hero-a). Основной сайт не тронут. Если ок — поставлю в прод.</div>
</body>
</html>
