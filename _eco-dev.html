<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Экономика — ripple (dev)</title><style>
  :root{--e:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0e0d;min-height:100vh;display:grid;place-items:center;padding:30px;font-family:'Onest','Inter',system-ui,sans-serif;color:#fff}
  .exp-card{position:relative;overflow:hidden;border-radius:26px;color:#fff;isolation:isolate;width:min(46vw,420px);aspect-ratio:4/5;box-shadow:0 34px 80px -40px rgba(0,30,18,.55)}
  .c-roi{background:radial-gradient(120% 120% at 85% 12%,#27b499 0%,transparent 55%),linear-gradient(155deg,#1f9c84,#11574a)}
  .base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;mix-blend-mode:screen}
  /* coded ripple rings — clean, no morphing */
  .ripples{position:absolute;left:56%;top:38%;z-index:1;pointer-events:none;mix-blend-mode:screen}
  .ripple{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    border:1.6px solid rgba(195,255,228,.92);box-shadow:0 0 12px rgba(150,255,220,.55);
    transform:scale(.2);opacity:0;animation:rip 3.4s var(--e) infinite}
  .ripple:nth-child(2){animation-delay:.85s}
  .ripple:nth-child(3){animation-delay:1.7s}
  .ripple:nth-child(4){animation-delay:2.55s}
  @keyframes rip{0%{transform:scale(.2);opacity:0}12%{opacity:.85}100%{transform:scale(7);opacity:0}}
  /* slow orbital line for depth (uniform rotation — no morph) */
  .orbit{position:absolute;left:56%;top:38%;width:190px;height:118px;margin:-59px 0 0 -95px;border-radius:50%;
    border:1px solid rgba(170,240,215,.20);z-index:1;mix-blend-mode:screen;transform:rotate(0);animation:orb 16s linear infinite}
  .orbit.b{width:250px;height:148px;margin:-74px 0 0 -125px;animation-duration:23s;animation-direction:reverse;border-color:rgba(170,240,215,.14)}
  @keyframes orb{to{transform:rotate(360deg)}}
  .exp-txt{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
  .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.82)}
  h3{margin:10px 0 0;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-size:1.5rem}
  p{margin-top:auto;padding-top:14px;font-size:13px;line-height:1.45;color:rgba(255,255,255,.78)}
  p b{color:#fff;font-weight:600}
  @media(prefers-reduced-motion:reduce){.ripple,.orbit{animation:none;opacity:.4}}
</style></head><body>
  <article class="exp-card c-roi">
    <img class="base" src="gen3/eco-hand.png" alt="">
    <div class="orbit"></div><div class="orbit b"></div>
    <div class="ripples"><span class="ripple"></span><span class="ripple"></span><span class="ripple"></span><span class="ripple"></span></div>
    <div class="exp-txt"><div><span class="label">Экономика</span><h3>Окупается за квартал</h3></div><p>До <b>25%</b> ФОТ · <b>1–6 мес</b>.</p></div>
  </article>
</body></html>
