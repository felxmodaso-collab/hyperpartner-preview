<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTE — hand-coded (artifact-free) dev</title><style>
  :root{--e:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0e0d;min-height:100vh;display:grid;place-items:center;padding:30px;font-family:'Onest','Inter',system-ui,sans-serif;color:#fff}
  .exp-card{position:relative;overflow:hidden;border-radius:26px;color:#fff;isolation:isolate;width:min(94vw,1060px);aspect-ratio:16/9;box-shadow:0 34px 80px -40px rgba(0,30,18,.55)}
  .c-fte{background:radial-gradient(120% 130% at 82% 8%,#1f7a59 0%,transparent 52%),linear-gradient(155deg,#16302B,#0c3327)}
  .base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;mix-blend-mode:screen}
  .shimmer{position:absolute;inset:0;z-index:1;mix-blend-mode:screen;pointer-events:none;opacity:.6;
    -webkit-mask:url(gen3/fte-center.png) center/cover no-repeat;mask:url(gen3/fte-center.png) center/cover no-repeat;
    -webkit-mask-mode:luminance;mask-mode:luminance;
    background:linear-gradient(115deg,transparent 40%,rgba(190,255,230,.95) 50%,transparent 60%);
    background-size:280% 100%;background-position:120% 0;animation:shim 4.6s linear infinite}
  @keyframes shim{to{background-position:-80% 0}}
  .px{position:absolute;inset:0;z-index:2;mix-blend-mode:screen;pointer-events:none}
  /* 609 counter — big, under FTE */
  .fte609{position:absolute;left:44%;top:71%;transform:translate(-50%,-50%);z-index:3;
    font-weight:800;font-size:clamp(46px,8vw,108px);letter-spacing:.02em;line-height:1;
    color:transparent;-webkit-text-stroke:2.5px rgba(220,255,238,.96);
    text-shadow:0 0 18px rgba(150,255,220,.55),0 0 4px rgba(255,255,255,.4);
    mix-blend-mode:screen;pointer-events:none;font-variant-numeric:tabular-nums}
  .exp-txt{position:relative;z-index:4;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,3vw,42px)}
  .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.82)}
  h3{margin:10px 0 0;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-size:clamp(1.9rem,3.2vw,2.7rem);max-width:14ch}
  p{margin-top:auto;padding-top:14px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.78);max-width:30ch}
  p b{color:#fff;font-weight:600}
  /* department chip — under the headline, in the clean left zone (readable) */
  .dept-chip{display:inline-flex;align-items:center;gap:9px;margin-top:16px;
    padding:7px 14px 7px 12px;border-radius:999px;border:1px solid rgba(170,255,220,.30);
    background:rgba(110,190,160,.12);font-size:13.5px;font-weight:600;letter-spacing:.01em;color:#eafff6;
    box-shadow:0 0 22px rgba(120,220,180,.13)}
  .dept-chip .dot{width:7px;height:7px;border-radius:50%;background:#bdf5dd;box-shadow:0 0 9px rgba(150,255,220,.95);flex:none;animation:dotp 1.8s ease-in-out infinite}
  @keyframes dotp{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
  .dept-chip .pre{color:rgba(255,255,255,.55);font-weight:500}
  .dept-chip .nm{transition:opacity .3s var(--e);display:inline-block;min-width:7.5ch}
</style></head><body>
  <article class="exp-card c-fte">
    <img class="base" src="gen3/fte-center.png" alt="">
    <div class="shimmer"></div>
    <canvas class="px" id="px"></canvas>
    <div class="fte609" id="fte609">0</div>
    <div class="exp-txt">
      <div>
        <span class="label">Масштаб</span>
        <h3>Снимаем рутину целыми отделами</h3>
        <div class="dept-chip"><span class="dot"></span><span class="pre">автоматизируем</span><span class="nm" id="deptName">Бухгалтерию</span></div>
      </div>
      <p><b>609 FTE</b> ручного труда — на автономных агентах.</p>
    </div>
  </article>
<script>
const cv=document.getElementById('px'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);
function rnd(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const R=rnd(11);
const EMIT={x:.605,y:.54},N=40,P=[];
for(let i=0;i<N;i++)P.push({phase:R(),sx:EMIT.x+(R()-.5)*.10,rise:.20+R()*.28,wob:(R()-.5)*.04,wf:3+R()*4,wp:R()*6.28,size:1.2+R()*2.0,kind:R(),spd:.7+R()*.7});
const LIFE=4.4,ease=p=>1-Math.pow(1-p,2);
function draw(x,y,s,a,k){ctx.globalAlpha=a;ctx.fillStyle='rgba(214,255,238,1)';ctx.shadowColor='rgba(150,255,220,.95)';ctx.shadowBlur=7*s;
  if(k<.5){ctx.beginPath();ctx.arc(x,y,s,0,6.2832);ctx.fill();}else{ctx.save();ctx.translate(x,y);ctx.rotate(k*9);ctx.fillRect(-s,-s,s*2,s*2);ctx.restore();}ctx.shadowBlur=0;}
function render(t){ctx.clearRect(0,0,W,H);for(const p of P){let pr=((t*p.spd)/LIFE+p.phase)%1;const e=ease(pr);
  const x=(p.sx+p.wob*Math.sin(pr*p.wf+p.wp))*W,y=(EMIT.y-p.rise*e)*H,a=Math.sin(pr*Math.PI)*.95;draw(x,y,p.size,a,p.kind);}ctx.globalAlpha=1;}
resize();
const cEl=document.getElementById('fte609'),nameEl=document.getElementById('deptName');
const Pr=new URLSearchParams(location.search);
const setC=n=>cEl.textContent=String(n);
function countUp(target,dur){let s=null;function f(t){if(s===null)s=t;const p=Math.min((t-s)/dur,1);setC(Math.round((1-Math.pow(1-p,3))*target));if(p<1)requestAnimationFrame(f);}requestAnimationFrame(f);}
const depts=['Бухгалтерию','HR','Поддержку','Продажи','Логистику','Закупки'];let di=1;
function swapDept(){nameEl.style.opacity='0';setTimeout(()=>{nameEl.textContent=depts[di%depts.length];di++;nameEl.style.opacity='1';},280);}
const tP=Pr.get('t'),cP=Pr.get('c'),dP=Pr.get('d');
if(tP!==null||cP!==null||dP!==null){render(tP!==null?parseFloat(tP):2.5);if(cP!==null)setC(parseInt(cP));if(dP!==null)nameEl.textContent=depts[parseInt(dP)%depts.length];}
else{let st=null;function loop(ts){if(st===null)st=ts;render((ts-st)/1000);requestAnimationFrame(loop);}requestAnimationFrame(loop);
  countUp(609,1700);setInterval(swapDept,2000);}
</script>
</body></html>
