<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTE overlay dev</title><style>
  :root{--e:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0e0d;min-height:100vh;display:grid;place-items:center;padding:30px;font-family:'Onest','Inter',system-ui,sans-serif;color:#fff}
  .exp-card{position:relative;overflow:hidden;border-radius:26px;color:#fff;isolation:isolate;width:min(94vw,1060px);aspect-ratio:16/9;box-shadow:0 34px 80px -40px rgba(0,30,18,.55)}
  .c-fte{background:radial-gradient(120% 130% at 82% 8%,#1f7a59 0%,transparent 52%),linear-gradient(155deg,#16302B,#0c3327)}
  .base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;mix-blend-mode:screen}
  /* 609 counter under FTE — outlined glow to match the letters */
  .fte609{position:absolute;left:45%;top:70%;transform:translate(-50%,-50%);z-index:2;
    font-weight:800;font-size:clamp(26px,4.6vw,58px);letter-spacing:.02em;line-height:1;
    color:transparent;-webkit-text-stroke:2px rgba(214,255,236,.94);
    text-shadow:0 0 12px rgba(150,255,220,.5);mix-blend-mode:screen;pointer-events:none;font-variant-numeric:tabular-nums}
  /* department names rising near the figures */
  .depts{position:absolute;inset:0;z-index:2;pointer-events:none}
  .dept{position:absolute;left:63%;top:50%;transform:translate(-50%,12px);opacity:0;
    font-size:clamp(13px,1.55vw,18px);font-weight:600;letter-spacing:.01em;white-space:nowrap;
    color:#eafff6;text-shadow:0 0 12px rgba(150,255,220,.7),0 0 2px rgba(255,255,255,.5);
    mix-blend-mode:screen;transition:opacity .5s var(--e),transform .6s var(--e)}
  .dept.in{opacity:1;transform:translate(-50%,-4px)}
  .dept.out{opacity:0;transform:translate(-50%,-44px);transition:opacity .6s var(--e),transform .9s var(--e)}
  .exp-txt{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,3vw,42px)}
  .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.82)}
  h3{margin:10px 0 0;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-size:clamp(1.9rem,3.2vw,2.7rem);max-width:14ch}
  p{margin-top:auto;padding-top:14px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.78);max-width:30ch}
  p b{color:#fff;font-weight:600}
</style></head><body>
  <article class="exp-card c-fte">
    <img class="base" src="gen3/fte-center.png" alt="">
    <div class="fte609">0</div>
    <div class="depts"></div>
    <div class="exp-txt">
      <div><span class="label">Масштаб</span><h3>Снимаем рутину целыми отделами</h3></div>
      <p><b>609 FTE</b> ручного труда — на автономных агентах.</p>
    </div>
  </article>
<script>
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cEl=document.querySelector('.fte609'), wrap=document.querySelector('.depts');
  const P=new URLSearchParams(location.search);
  const setC=n=>cEl.textContent=String(n);
  function countUp(target,dur){let s=null;function f(t){if(s===null)s=t;const p=Math.min((t-s)/dur,1);setC(Math.round((1-Math.pow(1-p,3))*target));if(p<1)requestAnimationFrame(f);}requestAnimationFrame(f);}
  const depts=['Бухгалтерия','HR','Поддержка','Продажи','Логистика','Закупки'];
  let di=0;
  function showDept(){const d=document.createElement('div');d.className='dept';d.textContent=depts[di%depts.length];wrap.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')));
    setTimeout(()=>d.classList.add('out'),1500); setTimeout(()=>d.remove(),2400); di++;}
  // deterministic for screenshots: ?c=<num>&d=<deptIndex>
  const cP=P.get('c'), dP=P.get('d');
  if(cP!==null||dP!==null){ if(cP!==null)setC(parseInt(cP)); if(dP!==null){const d=document.createElement('div');d.className='dept in';d.textContent=depts[parseInt(dP)%depts.length];wrap.appendChild(d);} }
  else if(reduce){ setC(609); }
  else { countUp(609,1700); showDept(); setInterval(showDept,2000); }
</script>
</body></html>
