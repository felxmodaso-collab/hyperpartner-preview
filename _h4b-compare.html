<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTE h4b — 3 варианта (фикс шестерёнок)</title><style>
  :root{--ease:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#070908;min-height:100vh;font-family:'Onest',system-ui,sans-serif;color:#eafff6;padding:32px;display:flex;flex-direction:column;gap:28px;align-items:center}
  h1{font-weight:500;font-size:20px;letter-spacing:-.01em;color:#cfeede}
  .sub{font-size:13px;color:#7fa896;max-width:64ch;text-align:center;line-height:1.5;margin-top:-16px}
  .grid{display:flex;flex-direction:column;gap:26px;width:min(96vw,1060px)}
  .item{display:flex;flex-direction:column;gap:10px}
  .cap{display:flex;align-items:baseline;gap:10px;font-size:14px}
  .cap b{font-size:16px;color:#bdf5dd}
  .cap span{color:#7fa896}
  .exp-card{position:relative;overflow:hidden;border-radius:22px;color:#fff;isolation:isolate;width:100%;aspect-ratio:16/9;
    background:radial-gradient(120% 130% at 82% 8%,#1f7a59 0%,transparent 52%),linear-gradient(155deg,#16302B,#0c3327);
    box-shadow:0 28px 70px -40px rgba(0,30,18,.55)}
  .exp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;mix-blend-mode:screen}
  .depts{position:absolute;inset:0;z-index:2;pointer-events:none}
  .dept{position:absolute;display:inline-flex;align-items:center;gap:.58em;padding:.5em 1em;border-radius:999px;
    border:1px solid rgba(180,255,220,.40);background:rgba(10,30,22,.30);
    font-size:14px;font-weight:500;color:#eafff6;white-space:nowrap;transform:translate(-0%,0);
    box-shadow:0 0 16px rgba(120,230,180,.14),inset 0 0 10px rgba(120,230,180,.05)}
  .dept::before{content:"";width:.4em;height:.4em;border-radius:50%;background:#bdf5dd;box-shadow:0 0 8px rgba(150,255,220,.95);flex:none}
  .exp-txt{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,2.6vw,36px)}
  .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.82)}
  h3{margin:8px 0 0;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-size:clamp(1.5rem,2.6vw,2.2rem);max-width:14ch}
  p{margin-top:auto;padding-top:12px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.78);max-width:34ch}
  p b{color:#fff;font-weight:600}
</style></head><body>
  <h1>FTE — 3 новых варианта анимации (шестерёнки пофикшены)</h1>
  <p class="sub">Источник тот же (fte-np3h-4), композиция 1-в-1. Сравни движение: A — шестерёнки крутятся «жёстко», B — не крутятся (только свет), C — другой seed жёсткого вращения. Чипы отделов на твоих сохранённых позициях.</p>
  <div class="grid" id="grid"></div>
  <script>
    const LAY={buh:[4.83,58.44],hr:[83.56,14.53],sup:[71.73,65.92],sale:[58.46,13.06],log:[39.46,76.50],proc:[60.13,89.83]};
    const NAMES={buh:'Бухгалтерия',hr:'HR',sup:'Поддержка',sale:'Продажи',log:'Логистика',proc:'Закупки'};
    const FS={buh:14,hr:13,sup:12.5,sale:16,log:13.5,proc:13.5};
    const V=[
      ['A','Шестерёнки крутятся (жёстко) · seed 7','gen3/fte-h4b-A.mp4'],
      ['B','Без вращения, только свечение · seed 17','gen3/fte-h4b-B.mp4'],
      ['C','Жёсткое вращение, другой seed · seed 27','gen3/fte-h4b-C.mp4'],
    ];
    const chips=k=>Object.keys(LAY).map(id=>`<span class="dept" style="left:${LAY[id][0]}%;top:${LAY[id][1]}%;font-size:${FS[id]}px">${NAMES[id]}</span>`).join('');
    document.getElementById('grid').innerHTML=V.map(([t,d,src])=>`
      <div class="item">
        <div class="cap"><b>Вариант ${t}</b><span>${d}</span></div>
        <article class="exp-card">
          <video class="exp-bg" src="${src}" muted loop playsinline autoplay></video>
          <div class="depts">${chips()}</div>
          <div class="exp-txt">
            <div><span class="label">Масштаб</span><h3>Снимаем рутину целыми отделами</h3></div>
            <p><b>609 FTE</b> ручного труда — на автономных агентах.</p>
          </div>
        </article>
      </div>`).join('');
  </script>
</body></html>
