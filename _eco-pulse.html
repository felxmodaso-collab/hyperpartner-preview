<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eco pulse phase test</title><style>
  :root{--ease:cubic-bezier(.16,1,.3,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0e0d;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Onest',system-ui,sans-serif;color:#fff}
  .exp-card{position:relative;overflow:hidden;border-radius:26px;isolation:isolate;width:420px;aspect-ratio:4/5;box-shadow:0 34px 80px -40px rgba(0,30,18,.55)}
  .c-roi{background:radial-gradient(120% 120% at 85% 12%,#27b499 0%,transparent 55%),linear-gradient(155deg,#1f9c84,#11574a)}
  .exp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;mix-blend-mode:screen}
  .c-roi .exp-bg{filter:brightness(.78) saturate(1.06)}
  @property --ecoPr{syntax:'<percentage>';inherits:false;initial-value:0%}
  .eco-pulse{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;
    -webkit-mask:url(gen3/eco2-v10.png) center/cover;mask:url(gen3/eco2-v10.png) center/cover;
    -webkit-mask-mode:luminance;mask-mode:luminance;
    background:radial-gradient(circle at 49% 44%,
      transparent calc(var(--ecoPr) - 18%),
      rgba(226,255,244,1) var(--ecoPr),
      transparent calc(var(--ecoPr) + 13%));
    animation:ecoPulse 3.4s linear infinite}
  .eco-pulse.b{animation-delay:1.7s}
  @keyframes ecoPulse{0%{--ecoPr:0%}100%{--ecoPr:120%}}
  .exp-txt{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
  .label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.82)}
  h3{margin:10px 0 0;font-weight:500;letter-spacing:-.02em;line-height:1.1;font-size:1.5rem}
  p{margin-top:auto;padding-top:14px;font-size:13px;line-height:1.45;color:rgba(255,255,255,.78)}
  p b{color:#fff;font-weight:600}
</style></head><body>
  <article class="exp-card c-roi">
    <img class="exp-bg" src="gen3/eco2-v10.png" alt="">
    <div class="eco-pulse" id="p1"></div><div class="eco-pulse b" id="p2"></div>
    <div class="exp-txt"><div><span class="label">Экономика</span><h3>Окупается за квартал</h3></div><p>До <b>25%</b> ФОТ · <b>1–6 мес</b>.</p></div>
  </article>
<script>
  var pr=new URLSearchParams(location.search).get('pr');
  if(pr!==null){[p1,p2].forEach(function(e){e.style.animation='none';e.style.setProperty('--ecoPr',pr+'%');});}
</script>
</body></html>
