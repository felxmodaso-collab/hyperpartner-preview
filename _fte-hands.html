<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTE — обе руки на ноуте (варианты)</title><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0d0c;color:#e8f5ef;font-family:'Onest',system-ui,sans-serif;padding:28px}
  h1{font-weight:500;font-size:19px;margin-bottom:4px}
  .sub{color:#7d908a;font-size:13px;margin-bottom:20px}
  .grid{display:flex;flex-direction:column;gap:18px;max-width:1000px;margin:0 auto}
  figure{background:#121615;border:1px solid #1e2522;border-radius:14px;overflow:hidden}
  figure img{display:block;width:100%;height:auto;background:#000}
  figcaption{padding:9px 14px;font-size:13px;color:#bfe9d8;display:flex;justify-content:space-between}
  figcaption .o{color:#7d908a}
  .miss{padding:40px;text-align:center;color:#6f857c;font-size:13px}
</style></head><body>
  <h1>FTE — обе руки на ноутбуке</h1>
  <div class="sub">Edit по np3: только руки переставлены на ноут, остальное (FTE 609, сеть, точки, растение) — как было. Выбери вариант.</div>
  <div class="grid">
    <figure><figcaption><b>оригинал</b><span class="o">рука была на бумаге</span></figcaption><img src="gen3/fte-np3.png"></figure>
    <figure><figcaption><b>вариант h4</b><span class="o">обе руки на ноуте</span></figcaption><img src="gen3/fte-np3h-4.png"></figure>
    <figure><figcaption><b>вариант h6</b><span class="o">обе руки на ноуте, наклон чуть больше</span></figcaption><img src="gen3/fte-np3h-6.png"></figure>
    <figure><figcaption><b>вариант h5</b><span class="o">третий (если уже досчитался)</span></figcaption><img src="gen3/fte-np3h-5.png" onerror="this.parentNode.innerHTML='<div class=miss>h5 ещё рендерится — обнови страницу через минуту</div>'"></figure>
  </div>
</body></html>
